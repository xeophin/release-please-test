lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/bar: {}

  packages/foo: {}

  packages/foobar:
    dependencies:
      bar:
        specifier: workspace:*
        version: link:../bar
      foo:
        specifier: workspace:*
        version: link:../foo
